<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مسیر تتوکاری</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #180f28; }
  input::placeholder, textarea::placeholder { color: #8a7996; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #4a3a5e; border-radius: 999px; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-4%,5%) scale(1.1); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(5%,-4%) scale(1.05); } }
  .blob-a { animation: drift1 18s ease-in-out infinite; }
  .blob-b { animation: drift2 22s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* ---------------------------------------------------------
   Local storage helpers (real-browser persistence)
--------------------------------------------------------- */
function loadLS(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
function saveLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { console.error("localStorage save failed", e); }
}
function useCollection(key) {
  const [items, setItems] = useState(() => loadLS(key, []));
  const persist = useCallback((next) => { setItems(next); saveLS(key, next); }, [key]);
  return [items, persist];
}
function uid() { return Math.random().toString(36).slice(2, 10); }

const STORAGE_KEYS = {
  sessions: "tj-sessions",
  checklist: "tj-checklist",
  refs: "tj-refs",
  portfolio: "tj-portfolio",
  clients: "tj-clients",
};

/* ---------------------------------------------------------
   Palette (for inline JS use, e.g. style objects)
--------------------------------------------------------- */
const C = {

  bgTo: "#2a1a33",
  surface: "rgba(255,255,255,0.045)",
  surfaceBorder: "rgba(232,140,110,0.16)",

  coralSoft: "#f0967d",
  gold: "#e2b878",

/* ---------------------------------------------------------

--------------------------------------------------------- */

  users: <><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,

  plus: <><path d="M12 5v14"/><path d="M5 12h14"/></>,

  flame: <path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2 1z"/>,

  chevron: <path d="M9 18l6-6-6-6"/>,
  star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>,
  phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>,
  calendar: <><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></>,
  link: <><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></>,
  droplet: <path d="M12 2.69s5.66 5.94 5.66 9.94A5.66 5.66 0 0 1 12 18.3a5.66 5.66 0 0 1-5.66-5.67C6.34 8.63 12 2.69 12 2.69z"/>,
};

function Icon({ name, size = 18, color = "currentColor", strokeWidth = 1.9, fill = "none", className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill === "none" ? "none" : fill}
      stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {ICON_PATHS[name]}
    </svg>
  );
}

/* ---------------------------------------------------------
   Static content
--------------------------------------------------------- */
const CHECKLIST_STAGES = [
  { id: "stage-1", title: "پایه و تئوری", items: [
    { id: "c1", label: "آشنایی با پوست و لایه‌های آن (اپیدرم/درم)" },
    { id: "c2", label: "بهداشت و استریلیزاسیون فردی" },
    { id: "c3", label: "شناخت دستگاه تتو (کویل / روتاری)" },
    { id: "c4", label: "شناخت انواع سوزن (RL / RS / M1 / M2 / CM)" },
    { id: "c5", label: "قوانین و مجوزهای کاری منطقه‌ات" },
  ]},
  { id: "stage-2", title: "تمرین روی سطوح مصنوعی", items: [
    { id: "c6", label: "خطوط صاف افقی و عمودی" },
    { id: "c7", label: "دایره و منحنی با فشار یکنواخت" },
    { id: "c8", label: "شیدینگ ساده (تک‌رنگ)" },
    { id: "c9", label: "گرادیان و واش شیدینگ" },
    { id: "c10", label: "تمرین روی میوه (پوست/عمق واقعی‌تر)" },
  ]},
  { id: "stage-3", title: "طراحی و آماده‌سازی", items: [
    { id: "c11", label: "طراحی فلش (flash) ساده" },
    { id: "c12", label: "ساخت استنسیل و ترنسفر" },
    { id: "c13", label: "تنظیم عمق و سرعت دستگاه" },
    { id: "c14", label: "ترکیب رنگ و مدیریت پالت" },
  ]},
  { id: "stage-4", title: "آماده برای مدل واقعی", items: [
    { id: "c15", label: "چیدمان ایستگاه کار طبق استاندارد بهداشتی" },
    { id: "c16", label: "مشاوره و رضایت‌نامه مشتری" },
    { id: "c17", label: "اولین کار روی پوست واقعی زیر نظر مربی" },
    { id: "c18", label: "آموزش مراقبت بعد از تتو به مشتری" },
  ]},
];

const NEEDLE_INFO = [
  { code: "RL", name: "Round Liner", use: "خطوط صاف و مشخص، طراحی خطی" },
  { code: "RS", name: "Round Shader", use: "شیدینگ نرم روی سطح کوچک، جزئیات" },
  { code: "M1", name: "Stacked Magnum", use: "شیدینگ و پرکردن سطوح بزرگ" },
  { code: "M2", name: "Weaved Magnum", use: "واش شیدینگ و گرادیان نرم" },
  { code: "CM", name: "Curved Magnum", use: "پیروی از انحنای بدن، شیدینگ کانتور" },
];

/* ---------------------------------------------------------
   Shared UI bits — soft, rounded, "ink drop" language
--------------------------------------------------------- */
function InkCard({ children, className = "", glow = "coral" }) {
  const glowColor = glow === "gold" ? "rgba(226,184,120,0.22)" : "rgba(232,121,95,0.22)";
  return (
    <div
      className={"relative rounded-[26px] p-4 overflow-hidden " + className}
      style={{
        background: "linear-gradient(155deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02))",
        border: "1px solid " + C.surfaceBorder,
        boxShadow: "0 8px 24px -12px rgba(0,0,0,0.5)",
      }}
    >
      <div
        className="absolute -top-8 -left-8 w-24 h-24 rounded-full pointer-events-none"
        style={{ background: glowColor, filter: "blur(22px)" }}
      />
      <div className="relative">{children}</div>
    </div>
  );
}

function SectionTitle({ eyebrow, title, action }) {
  return (
    <div className="flex items-end justify-between mb-4">
      <div>
        {eyebrow && (
          <div className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 mb-2" style={{ background: C.chip }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: C.gold }} />
            <span className="font-mono text-[10px] tracking-widest" style={{ color: C.gold }}>{eyebrow}</span>
          </div>
        )}
        <h2 className="text-4xl leading-none" style={{ fontFamily: "'Lalezar', 'Vazirmatn', sans-serif", color: C.cream }}>{title}</h2>
      </div>
      {action}
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div className="rounded-[26px] py-10 text-center text-sm" style={{ border: "2px dotted " + C.surfaceBorder, color: C.muted }}>
      <div className="mx-auto mb-2 w-10 h-10 rounded-full flex items-center justify-center" style={{ background: C.chip }}>
        <Icon name="droplet" size={16} color={C.gold} />
      </div>
      {text}
    </div>
  );
}

function IconBtn({ onClick, children, label }) {
  return (
    <button onClick={onClick} aria-label={label}
      className="flex items-center gap-1.5 rounded-full text-white px-4 py-2.5 text-sm font-medium transition-transform active:scale-95 hover:brightness-110"
      style={{ background: "linear-gradient(135deg, #ef8b6f, #d9673f)", boxShadow: "0 6px 16px -6px rgba(217,103,63,0.6)" }}>
      {children}
    </button>
  );
}

const inputCls = "w-full rounded-2xl px-3 py-2 text-sm outline-none transition-colors";
const inputStyle = { background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.08)", color: C.cream };

function Field({ children }) {
  return <label className="text-xs block" style={{ color: C.muted }}>{children}</label>;
}

/* ---------------------------------------------------------
   Dashboard
--------------------------------------------------------- */
function Dashboard({ sessions, checklist, clients, onNav }) {
  const totalMinutes = sessions.reduce((s, x) => s + (Number(x.duration) || 0), 0);
  const totalHours = (totalMinutes / 60).toFixed(1);
  const thisWeek = sessions.filter((s) => {
    const d = new Date(s.date); const now = new Date();
    const diff = (now - d) / (1000 * 60 * 60 * 24);
    return diff >= 0 && diff <= 7;
  }).length;

  const allChecklistItems = CHECKLIST_STAGES.flatMap((st) => st.items);
  const doneCount = allChecklistItems.filter((it) => checklist[it.id]).length;
  const progressPct = Math.round((doneCount / allChecklistItems.length) * 100) || 0;

  const upcomingClients = clients
    .filter((c) => c.date && new Date(c.date) >= new Date().setHours(0, 0, 0, 0))
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 3);

  const stats = [
    { label: "کل ساعت تمرین", value: totalHours, icon: "clock", glow: "gold" },
    { label: "جلسه این هفته", value: thisWeek, icon: "flame", glow: "coral" },
    { label: "پیشرفت آموزش", value: progressPct + "%", icon: "list", glow: "gold" },
  ];

  return (
    <div className="space-y-6">
      <div>
        <div className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 mb-2" style={{ background: C.chip }}>
          <span className="w-1.5 h-1.5 rounded-full" style={{ background: C.gold }} />
          <span className="font-mono text-[10px] tracking-widest" style={{ color: C.gold }}>ژورنال شاگردی</span>
        </div>
        <h1 className="text-5xl leading-tight" style={{ fontFamily: "'Lalezar', 'Vazirmatn', sans-serif", color: C.cream }}>مسیر تتوکاری تو</h1>
        <p className="text-sm mt-2" style={{ color: C.muted }}>هر جلسه تمرین یک لایه رنگ اضافه به مهارتت هست. ادامه بده.</p>
        <svg viewBox="0 0 400 24" className="w-full h-4 mt-4" preserveAspectRatio="none">
          <path d="M0 12 C 50 0, 100 24, 150 12 S 250 0, 300 12 S 380 22, 400 12" fill="none" stroke={C.coral} strokeOpacity="0.45" strokeWidth="2.5" strokeLinecap="round" />
        </svg>
      </div>

      <div className="grid grid-cols-3 gap-3">
        {stats.map((s) => (
          <InkCard key={s.label} className="text-center" glow={s.glow}>
            <div className="mx-auto mb-2 w-9 h-9 rounded-full flex items-center justify-center" style={{ background: C.chip }}>
              <Icon name={s.icon} size={15} color={C.gold} />
            </div>
            <div className="text-2xl" style={{ fontFamily: "'JetBrains Mono', monospace", color: C.cream }}>{s.value}</div>
            <div className="text-[10px] mt-1" style={{ color: C.muted }}>{s.label}</div>
          </InkCard>
        ))}
      </div>

      <InkCard glow="gold">
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm font-medium" style={{ color: C.cream }}>پیشرفت نقشه‌ی راه</span>
          <span className="font-mono text-xs" style={{ color: C.gold }}>{doneCount}/{allChecklistItems.length}</span>
        </div>
        <div className="h-2.5 w-full rounded-full overflow-hidden" style={{ background: "rgba(255,255,255,0.07)" }}>
          <div className="h-full rounded-full transition-all duration-700" style={{ width: progressPct + "%", background: "linear-gradient(90deg, #ef8b6f, #e2b878)" }} />
        </div>
        <button onClick={() => onNav("checklist")} className="mt-3 flex items-center gap-1 text-xs hover:brightness-125" style={{ color: C.gold }}>
          مشاهده‌ی چک‌لیست کامل <Icon name="chevron" size={12} className="rotate-180" />
        </button>
      </InkCard>

      <div>
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm font-medium" style={{ color: C.cream }}>نوبت‌های پیش رو</span>
          <button onClick={() => onNav("clients")} className="text-xs hover:brightness-125" style={{ color: C.gold }}>همه</button>
        </div>
        {upcomingClients.length === 0 ? <EmptyState text="نوبتی ثبت نشده." /> : (
          <div className="space-y-2">
            {upcomingClients.map((c) => (
              <div key={c.id} className="flex items-center justify-between rounded-2xl px-3.5 py-2.5" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)" }}>
                <div>
                  <div className="text-sm" style={{ color: C.cream }}>{c.name}</div>
                  <div className="text-[11px]" style={{ color: C.muted }}>{c.service}</div>
                </div>
                <div className="font-mono text-xs" style={{ color: C.gold }}>{c.date}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Practice Log
--------------------------------------------------------- */
function PracticeLog({ sessions, setSessions }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ date: new Date().toISOString().slice(0, 10), surface: "پوست مصنوعی", technique: "", duration: "", rating: 3, notes: "" });
  const surfaces = ["پوست مصنوعی", "میوه (پرتقال/موز)", "کاغذ", "پوست واقعی (زیر نظر مربی)"];

  function addSession() {
    if (!form.technique.trim()) return;
    setSessions([{ id: uid(), ...form }, ...sessions]);
    setForm({ ...form, technique: "", duration: "", notes: "" });
    setShowForm(false);
  }
  function removeSession(id) { setSessions(sessions.filter((s) => s.id !== id)); }

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="لاگ روزانه" title="جلسات تمرین" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن جلسه"><Icon name="plus" size={16} /> جلسه جدید</IconBtn>
      } />

      {showForm && (
        <InkCard className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <Field>تاریخ
              <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls + " mt-1"} style={inputStyle} />
            </Field>
            <Field>سطح تمرین
              <select value={form.surface} onChange={(e) => setForm({ ...form, surface: e.target.value })} className={inputCls + " mt-1"} style={inputStyle}>
                {surfaces.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
          </div>
          <Field>تکنیک تمرین‌شده
            <input type="text" value={form.technique} onChange={(e) => setForm({ ...form, technique: e.target.value })} placeholder="مثلاً: خطوط منحنی، شیدینگ واش" className={inputCls + " mt-1"} style={inputStyle} />
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field>مدت (دقیقه)
              <input type="number" min="0" value={form.duration} onChange={(e) => setForm({ ...form, duration: e.target.value })} className={inputCls + " mt-1"} style={inputStyle} />
            </Field>
            <Field>رضایت از نتیجه
              <div className="mt-2 flex gap-1">
                {[1, 2, 3, 4, 5].map((n) => (
                  <button key={n} type="button" onClick={() => setForm({ ...form, rating: n })} aria-label={n + " ستاره"}>
                    <Icon name="star" size={18} fill={n <= form.rating ? C.gold : "none"} color={n <= form.rating ? C.gold : "#5c4a70"} />
                  </button>
                ))}
              </div>
            </Field>
          </div>
          <Field>یادداشت
            <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} rows={2} placeholder="چی خوب پیش رفت، چی نیاز به تمرین بیشتر داره؟" className={inputCls + " mt-1 resize-none"} style={inputStyle} />
          </Field>
          <div className="flex gap-2 pt-1">
            <IconBtn onClick={addSession} label="ذخیره">ذخیره جلسه</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm hover:brightness-125" style={{ color: C.muted }}>انصراف</button>
          </div>
        </InkCard>
      )}

      {sessions.length === 0 ? <EmptyState text="هنوز جلسه‌ای ثبت نشده. اولین تمرینت رو ثبت کن." /> : (
        <div className="space-y-3">
          {sessions.map((s) => (
            <InkCard key={s.id} className="relative">
              <button onClick={() => removeSession(s.id)} className="absolute left-0 top-0 hover:brightness-125" style={{ color: C.faint }} aria-label="حذف جلسه"><Icon name="trash" size={14} /></button>
              <div className="flex items-center gap-2 mb-1">
                <span className="font-mono text-xs" style={{ color: C.gold }}>{s.date}</span>
                <span className="text-[10px] px-2 py-0.5 rounded-full" style={{ color: C.muted, background: C.chip }}>{s.surface}</span>
              </div>
              <div className="font-medium" style={{ color: C.cream }}>{s.technique}</div>
              {s.notes && <div className="text-sm mt-1" style={{ color: C.muted }}>{s.notes}</div>}
              <div className="flex items-center justify-between mt-2">
                <div className="flex gap-0.5">
                  {[1, 2, 3, 4, 5].map((n) => <Icon key={n} name="star" size={14} fill={n <= s.rating ? C.gold : "none"} color={n <= s.rating ? C.gold : "#5c4a70"} />)}
                </div>
                {s.duration && <span className="font-mono text-[11px]" style={{ color: C.muted }}>{s.duration} دقیقه</span>}
              </div>
            </InkCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Checklist
--------------------------------------------------------- */
function Checklist({ checklist, setChecklist }) {
  function toggle(id) { setChecklist({ ...checklist, [id]: !checklist[id] }); }
  return (
    <div className="space-y-6">
      <SectionTitle eyebrow="نقشه‌ی راه" title="چک‌لیست آموزش" />
      {CHECKLIST_STAGES.map((stage, idx) => {
        const done = stage.items.filter((it) => checklist[it.id]).length;
        return (
          <div key={stage.id}>
            <div className="flex items-center gap-2 mb-2">
              <span className="w-6 h-6 rounded-full flex items-center justify-center font-mono text-[11px]" style={{ background: C.chip, color: C.coralSoft }}>{idx + 1}</span>
              <h3 className="text-sm font-medium" style={{ color: C.cream }}>{stage.title}</h3>
              <span className="font-mono text-[10px] mr-auto" style={{ color: C.muted }}>{done}/{stage.items.length}</span>
            </div>
            <div className="space-y-1.5">
              {stage.items.map((it) => (
                <button key={it.id} onClick={() => toggle(it.id)} className="w-full flex items-center gap-3 rounded-2xl px-3.5 py-2.5 text-right transition-colors"
                  style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)" }}>
                  <span className="flex-shrink-0 w-5 h-5 rounded-full border flex items-center justify-center transition-colors"
                    style={{ background: checklist[it.id] ? "linear-gradient(135deg,#ef8b6f,#d9673f)" : "transparent", borderColor: checklist[it.id] ? "#ef8b6f" : "#5c4a70" }}>
                    {checklist[it.id] && <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5l3 3 5-6" stroke="#fff" strokeWidth="1.7" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </span>
                  <span className="text-sm" style={{ color: checklist[it.id] ? C.faint : C.cream, textDecoration: checklist[it.id] ? "line-through" : "none" }}>{it.label}</span>
                </button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------
   Reference Library
--------------------------------------------------------- */
function References({ refs, setRefs }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", url: "", tags: "", notes: "" });

  function addRef() {
    if (!form.title.trim()) return;
    setRefs([{ id: uid(), ...form }, ...refs]);
    setForm({ title: "", url: "", tags: "", notes: "" });
    setShowForm(false);
  }
  function removeRef(id) { setRefs(refs.filter((r) => r.id !== id)); }

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="کتابخانه" title="طرح‌ها و رفرنس" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن رفرنس"><Icon name="plus" size={16} /> رفرنس جدید</IconBtn>
      } />

      {showForm && (
        <InkCard className="space-y-3">
          <input type="text" placeholder="عنوان (مثلاً: سبک اولد اسکول - گل رز)" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} className={inputCls} style={inputStyle} />
          <input type="text" placeholder="لینک تصویر یا رفرنس (اختیاری)" value={form.url} onChange={(e) => setForm({ ...form, url: e.target.value })} className={inputCls} style={inputStyle} />
          <input type="text" placeholder="برچسب‌ها با کاما (سبک، سوژه، رنگ...)" value={form.tags} onChange={(e) => setForm({ ...form, tags: e.target.value })} className={inputCls} style={inputStyle} />
          <textarea placeholder="یادداشت" rows={2} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} className={inputCls + " resize-none"} style={inputStyle} />
          <div className="flex gap-2">
            <IconBtn onClick={addRef} label="ذخیره">ذخیره</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm hover:brightness-125" style={{ color: C.muted }}>انصراف</button>
          </div>
        </InkCard>
      )}

      {refs.length === 0 ? <EmptyState text="هنوز رفرنسی اضافه نکردی." /> : (
        <div className="grid grid-cols-2 gap-3">
          {refs.map((r) => (
            <InkCard key={r.id} className="relative" glow="gold">
              <button onClick={() => removeRef(r.id)} className="absolute left-0 top-0 hover:brightness-125" style={{ color: C.faint }} aria-label="حذف"><Icon name="x" size={14} /></button>
              <div className="text-sm font-medium pl-4" style={{ color: C.cream }}>{r.title}</div>
              {r.url && (
                <a href={r.url} target="_blank" rel="noreferrer" className="flex items-center gap-1 text-[11px] mt-1 truncate hover:brightness-125" style={{ color: C.gold }}>
                  <Icon name="link" size={12} className="flex-shrink-0" /><span className="truncate">{r.url}</span>
                </a>
              )}
              {r.tags && (
                <div className="flex flex-wrap gap-1 mt-2">
                  {r.tags.split(",").map((t, i) => t.trim() && <span key={i} className="text-[10px] px-1.5 py-0.5 rounded-full" style={{ color: C.muted, background: C.chip }}>{t.trim()}</span>)}
                </div>
              )}
              {r.notes && <div className="text-xs mt-2" style={{ color: C.muted }}>{r.notes}</div>}
            </InkCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Technical reference (static)
--------------------------------------------------------- */
function Technical() {
  return (
    <div className="space-y-6">
      <SectionTitle eyebrow="مرجع" title="اطلاعات فنی" />
      <InkCard glow="gold">
        <p className="text-xs leading-relaxed" style={{ color: C.gold }}>
          این بخش فقط یک مرور کلی برای یادگیریه. تنظیمات واقعیِ ولتاژ، سرعت و عمق به دستگاه، برند سوزن و توصیه‌ی مربیت بستگی داره — همیشه دستورالعمل مربی و سازنده‌ی دستگاه رو ملاک قرار بده.
        </p>
      </InkCard>
      <div>
        <h3 className="text-sm font-medium mb-2" style={{ color: C.cream }}>گروه‌بندی سوزن‌ها</h3>
        <div className="space-y-2">
          {NEEDLE_INFO.map((n) => (
            <div key={n.code} className="flex items-start gap-3 rounded-2xl px-3.5 py-2.5" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)" }}>
              <span className="font-mono text-xs px-2 py-1 rounded-full flex-shrink-0" style={{ color: C.coralSoft, background: C.chip }}>{n.code}</span>
              <div>
                <div className="text-sm" style={{ color: C.cream }}>{n.name}</div>
                <div className="text-xs" style={{ color: C.muted }}>{n.use}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div>
        <h3 className="text-sm font-medium mb-2" style={{ color: C.cream }}>چک‌لیست بهداشتی هر جلسه</h3>
        <ul className="space-y-1.5 text-sm" style={{ color: C.muted }}>
          {["دستکش یک‌بار مصرف برای هر مشتری", "سوزن و کارتریج استریل و یک‌بار مصرف", "پوشش‌گذاری سطوح (بارریر) قبل از شروع", "ضدعفونی پوست قبل از استنسیل", "دفع صحیح زباله‌های نوک‌تیز (شارپس)"].map((t, i) => (
            <li key={i} className="flex items-start gap-2"><span className="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style={{ background: C.gold }} />{t}</li>
          ))}
        </ul>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Portfolio
--------------------------------------------------------- */
function Portfolio({ portfolio, setPortfolio }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", date: new Date().toISOString().slice(0, 10), style: "", imageUrl: "", notes: "", rating: 3 });

  function addItem() {
    if (!form.title.trim()) return;
    setPortfolio([{ id: uid(), ...form }, ...portfolio]);
    setForm({ ...form, title: "", style: "", imageUrl: "", notes: "" });
    setShowForm(false);
  }
  function removeItem(id) { setPortfolio(portfolio.filter((p) => p.id !== id)); }

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="گالری" title="نمونه‌کارها" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن کار"><Icon name="plus" size={16} /> کار جدید</IconBtn>
      } />

      {showForm && (
        <InkCard className="space-y-3">
          <input type="text" placeholder="عنوان کار" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} className={inputCls} style={inputStyle} />
          <div className="grid grid-cols-2 gap-3">
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} style={inputStyle} />
            <input type="text" placeholder="سبک (سنتی، خط‌محور...)" value={form.style} onChange={(e) => setForm({ ...form, style: e.target.value })} className={inputCls} style={inputStyle} />
          </div>
          <input type="text" placeholder="لینک عکس (اختیاری)" value={form.imageUrl} onChange={(e) => setForm({ ...form, imageUrl: e.target.value })} className={inputCls} style={inputStyle} />
          <textarea placeholder="یادداشت" rows={2} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} className={inputCls + " resize-none"} style={inputStyle} />
          <div className="flex gap-2">
            <IconBtn onClick={addItem} label="ذخیره">ذخیره</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm hover:brightness-125" style={{ color: C.muted }}>انصراف</button>
          </div>
        </InkCard>
      )}

      {portfolio.length === 0 ? <EmptyState text="هنوز کاری ثبت نشده." /> : (
        <div className="grid grid-cols-2 gap-3">
          {portfolio.map((p) => (
            <InkCard key={p.id} className="relative overflow-hidden" glow="coral">
              <button onClick={() => removeItem(p.id)} className="absolute left-2 top-2 z-10 rounded-full p-1 text-white hover:brightness-125" style={{ background: "rgba(0,0,0,0.4)" }} aria-label="حذف"><Icon name="x" size={12} /></button>
              {p.imageUrl && <img src={p.imageUrl} alt={p.title} className="w-full h-24 object-cover rounded-2xl mb-2 -mt-1" onError={(e) => (e.target.style.display = "none")} />}
              <div className="text-sm font-medium" style={{ color: C.cream }}>{p.title}</div>
              <div className="text-[11px]" style={{ color: C.muted }}>{p.style} {p.style && "·"} {p.date}</div>
              {p.notes && <div className="text-xs mt-1" style={{ color: C.muted }}>{p.notes}</div>}
            </InkCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Clients / bookings
--------------------------------------------------------- */
function Clients({ clients, setClients }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: "", phone: "", date: "", service: "", status: "در انتظار", notes: "" });

  function addClient() {
    if (!form.name.trim()) return;
    setClients([{ id: uid(), ...form }, ...clients]);
    setForm({ name: "", phone: "", date: "", service: "", status: "در انتظار", notes: "" });
    setShowForm(false);
  }
  function removeClient(id) { setClients(clients.filter((c) => c.id !== id)); }

  const statusColor = { "در انتظار": C.gold, "قطعی": C.green, "انجام شد": C.faint };

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="مدیریت" title="مشتری‌ها و نوبت‌ها" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن مشتری"><Icon name="plus" size={16} /> مشتری جدید</IconBtn>
      } />

      {showForm && (
        <InkCard className="space-y-3">
          <input type="text" placeholder="نام مشتری" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className={inputCls} style={inputStyle} />
          <div className="grid grid-cols-2 gap-3">
            <input type="tel" placeholder="شماره تماس" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className={inputCls} style={inputStyle} />
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} style={inputStyle} />
          </div>
          <input type="text" placeholder="نوع کار (مثلاً: خط‌محور کوچک روی مچ)" value={form.service} onChange={(e) => setForm({ ...form, service: e.target.value })} className={inputCls} style={inputStyle} />
          <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} className={inputCls} style={inputStyle}>
            <option>در انتظار</option><option>قطعی</option><option>انجام شد</option>
          </select>
          <textarea placeholder="یادداشت" rows={2} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} className={inputCls + " resize-none"} style={inputStyle} />
          <div className="flex gap-2">
            <IconBtn onClick={addClient} label="ذخیره">ذخیره</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm hover:brightness-125" style={{ color: C.muted }}>انصراف</button>
          </div>
        </InkCard>
      )}

      {clients.length === 0 ? <EmptyState text="مشتری‌ای ثبت نشده." /> : (
        <div className="space-y-2">
          {clients.map((c) => (
            <InkCard key={c.id} className="relative">
              <button onClick={() => removeClient(c.id)} className="absolute left-0 top-0 hover:brightness-125" style={{ color: C.faint }} aria-label="حذف"><Icon name="trash" size={14} /></button>
              <div className="flex items-center gap-2">
                <span className="font-medium" style={{ color: C.cream }}>{c.name}</span>
                <span className="text-[10px] px-2 py-0.5 rounded-full" style={{ color: statusColor[c.status] || C.muted, background: C.chip }}>{c.status}</span>
              </div>
              <div className="text-sm mt-1" style={{ color: C.muted }}>{c.service}</div>
              <div className="flex items-center gap-4 mt-2 text-[11px]" style={{ color: C.muted }}>
                {c.phone && <span className="flex items-center gap-1"><Icon name="phone" size={12} /> {c.phone}</span>}
                {c.date && <span className="flex items-center gap-1 font-mono"><Icon name="calendar" size={12} /> {c.date}</span>}
              </div>
              {c.notes && <div className="text-xs mt-1.5" style={{ color: C.muted }}>{c.notes}</div>}
            </InkCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   App shell
--------------------------------------------------------- */
const TABS = [
  { id: "dashboard", label: "خانه", icon: "grid" },
  { id: "practice", label: "تمرین", icon: "pencil" },
  { id: "checklist", label: "آموزش", icon: "list" },
  { id: "refs", label: "طرح‌ها", icon: "book" },
  { id: "portfolio", label: "نمونه‌کار", icon: "images" },
  { id: "clients", label: "مشتری", icon: "users" },
  { id: "technical", label: "فنی", icon: "info" },
];

function BackgroundArt() {
  return (
    <div className="fixed inset-0 -z-10 overflow-hidden" style={{ background: "linear-gradient(160deg,#1b1130,#241633 45%,#2c1a30)" }}>
      <div className="blob-a absolute -top-24 -right-16 w-72 h-72 rounded-full" style={{ background: "radial-gradient(circle, rgba(232,121,95,0.35), transparent 70%)", filter: "blur(10px)" }} />
      <div className="blob-b absolute top-1/2 -left-24 w-80 h-80 rounded-full" style={{ background: "radial-gradient(circle, rgba(226,184,120,0.22), transparent 70%)", filter: "blur(10px)" }} />
      <div className="absolute bottom-0 right-1/3 w-64 h-64 rounded-full blob-a" style={{ background: "radial-gradient(circle, rgba(150,90,160,0.25), transparent 70%)", filter: "blur(10px)" }} />
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("dashboard");
  const [sessions, setSessions] = useCollection(STORAGE_KEYS.sessions);
  const [refs, setRefs] = useCollection(STORAGE_KEYS.refs);
  const [portfolio, setPortfolio] = useCollection(STORAGE_KEYS.portfolio);
  const [clients, setClients] = useCollection(STORAGE_KEYS.clients);
  const [checklist, setChecklistState] = useState(() => loadLS(STORAGE_KEYS.checklist, {}));

  const setChecklist = useCallback((next) => {
    setChecklistState(next);
    saveLS(STORAGE_KEYS.checklist, next);
  }, []);

  return (
    <div dir="rtl" className="min-h-screen flex flex-col" style={{ fontFamily: "'Vazirmatn', sans-serif", color: C.cream }}>
      <BackgroundArt />
      <main className="flex-1 max-w-md w-full mx-auto px-4 pt-6 pb-28">
        {tab === "dashboard" && <Dashboard sessions={sessions} checklist={checklist} clients={clients} onNav={setTab} />}
        {tab === "practice" && <PracticeLog sessions={sessions} setSessions={setSessions} />}
        {tab === "checklist" && <Checklist checklist={checklist} setChecklist={setChecklist} />}
        {tab === "refs" && <References refs={refs} setRefs={setRefs} />}
        {tab === "portfolio" && <Portfolio portfolio={portfolio} setPortfolio={setPortfolio} />}
        {tab === "clients" && <Clients clients={clients} setClients={setClients} />}
        {tab === "technical" && <Technical />}
      </main>

      <nav className="fixed bottom-4 left-4 right-4 max-w-md mx-auto flex justify-around items-center py-2 px-2 rounded-full"
        style={{ background: "rgba(36,22,45,0.85)", backdropFilter: "blur(14px)", border: "1px solid rgba(255,255,255,0.08)", boxShadow: "0 12px 30px -10px rgba(0,0,0,0.6)" }}>
        {TABS.map((t) => {
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex flex-col items-center gap-1 px-1 py-1 flex-1">
              <span className="w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300"
                style={{ background: active ? "linear-gradient(135deg,#ef8b6f,#d9673f)" : "transparent" }}>
                <Icon name={t.icon} size={16} color={active ? "#fff" : C.faint} />
              </span>
              <span className="text-[9px] transition-colors" style={{ color: active ? C.gold : C.faint }}>{t.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
