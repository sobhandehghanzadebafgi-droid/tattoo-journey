const { useState, useEffect, useCallback } = React;

/* ---------------------------------------------------------
   Local storage helpers (works on any real browser/host,
   unlike Claude's artifact-only window.storage)
--------------------------------------------------------- */
function loadLS(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveLS(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error("localStorage save failed", e);
  }
}
function useCollection(key) {
  const [items, setItems] = useState(() => loadLS(key, []));
  const persist = useCallback((next) => {
    setItems(next);
    saveLS(key, next);
  }, [key]);
  return [items, persist];
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

const STORAGE_KEYS = {
  sessions: "tj-sessions",
  checklist: "tj-checklist",
  refs: "tj-refs",

  phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>,

  link: <><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></>,

function Icon({ name, size = 18, color = "currentColor", strokeWidth = 1.75, fill = "none", className = "" }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill={fill === "none" ? "none" : fill}
      stroke={color}
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      {ICON_PATHS[name]}
    </svg>
  );
}

/* ---------------------------------------------------------
   Static content
--------------------------------------------------------- */
const CHECKLIST_STAGES = [

    { id: "c2", label: "بهداشت و استریلیزاسیون فردی" },
    { id: "c3", label: "شناخت دستگاه تتو (کویل / روتاری)" },
    { id: "c4", label: "شناخت انواع سوزن (RL / RS / M1 / M2 / CM)" },
    { id: "c5", label: "قوانین و مجوزهای کاری منطقه‌ات" },
  ]},
  { id: "stage-2", title: "تمرین روی سطوح مصنوعی", items: [

    { id: "c9", label: "گرادیان و واش شیدینگ" },

const NEEDLE_INFO = [
  { code: "RL", name: "Round Liner", use: "خطوط صاف و مشخص، طراحی خطی" },
  { code: "RS", name: "Round Shader", use: "شیدینگ نرم روی سطح کوچک، جزئیات" },
  { code: "M1", name: "Stacked Magnum", use: "شیدینگ و پرکردن سطوح بزرگ" },
  { code: "M2", name: "Weaved Magnum", use: "واش شیدینگ و گرادیان نرم" },

/* ---------------------------------------------------------
   Shared UI bits
--------------------------------------------------------- */
function StencilCard({ children, className = "" }) {
  return (
    <div
      className={"relative rounded-sm border border-dashed border-[#4a443a] bg-[#1e1b18] p-4 " + className}
      style={{
        backgroundImage: "radial-gradient(circle at 8px 8px, #3a352e 1.5px, transparent 1.5px)",
        backgroundSize: "16px 16px",
        backgroundPosition: "top right",
      }}
    >
      {children}
    </div>
  );
}
function SectionTitle({ eyebrow, title, action }) {
  return (
    <div className="flex items-end justify-between mb-4">
      <div>
        {eyebrow && <div className="font-mono text-[11px] tracking-widest text-[#c9a06a] mb-1">{eyebrow}</div>}
        <h2 className="text-3xl text-[#f3ede2] leading-none" style={{ fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>{title}</h2>
      </div>
      {action}
    </div>
  );
}
function EmptyState({ text }) {
  return <div className="border border-dashed border-[#3a352e] rounded-sm py-10 text-center text-[#9c9388] text-sm">{text}</div>;
}
function IconBtn({ onClick, children, label }) {
  return (
    <button onClick={onClick} aria-label={label} className="flex items-center gap-1.5 rounded-sm bg-[#b8272f] hover:bg-[#c9313a] active:bg-[#9e2028] text-[#f3ede2] px-3 py-2 text-sm font-medium transition-colors">
      {children}
    </button>
  );
}

/* ---------------------------------------------------------
   Dashboard
--------------------------------------------------------- */
function Dashboard({ sessions, checklist, clients, onNav }) {
  const totalMinutes = sessions.reduce((s, x) => s + (Number(x.duration) || 0), 0);
  const totalHours = (totalMinutes / 60).toFixed(1);
  const thisWeek = sessions.filter((s) => {
    const d = new Date(s.date);
    const now = new Date();
    const diff = (now - d) / (1000 * 60 * 60 * 24);
    return diff >= 0 && diff <= 7;
  }).length;

  const allChecklistItems = CHECKLIST_STAGES.flatMap((st) => st.items);
  const doneCount = allChecklistItems.filter((it) => checklist[it.id]).length;
  const progressPct = Math.round((doneCount / allChecklistItems.length) * 100) || 0;

  const upcomingClients = clients
    .filter((c) => c.date && new Date(c.date) >= new Date().setHours(0, 0, 0, 0))
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 3);

  const stats = [
    { label: "کل ساعت تمرین", value: totalHours, icon: "clock" },
    { label: "جلسه این هفته", value: thisWeek, icon: "flame" },
    { label: "پیشرفت آموزش", value: progressPct + "%", icon: "list" },
  ];

  return (
    <div className="space-y-6">
      <div>
        <div className="font-mono text-[11px] tracking-widest text-[#c9a06a] mb-1">ژورنال شاگردی</div>
        <h1 className="text-4xl text-[#f3ede2] leading-none" style={{ fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em" }}>مسیر تتوکاری تو</h1>
        <p className="text-[#9c9388] text-sm mt-2">هر جلسه تمرین یک لایه رنگ اضافه به مهارتت هست. ادامه بده.</p>
      </div>

      <div className="grid grid-cols-3 gap-3">
        {stats.map((s) => (
          <StencilCard key={s.label} className="text-center">
            <Icon name={s.icon} size={16} color="#c9a06a" className="mx-auto mb-2" />
            <div className="text-2xl text-[#f3ede2]" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{s.value}</div>
            <div className="text-[10px] text-[#9c9388] mt-1">{s.label}</div>
          </StencilCard>
        ))}
      </div>

      <StencilCard>
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm text-[#f3ede2] font-medium">پیشرفت نقشه‌ی راه</span>
          <span className="font-mono text-xs text-[#c9a06a]">{doneCount}/{allChecklistItems.length}</span>
        </div>
        <div className="h-2 w-full bg-[#26221e] rounded-full overflow-hidden">
          <div className="h-full bg-[#b8272f] transition-all duration-500" style={{ width: progressPct + "%" }} />
        </div>
        <button onClick={() => onNav("checklist")} className="mt-3 flex items-center gap-1 text-xs text-[#c9a06a] hover:text-[#e0b788]">
          مشاهده‌ی چک‌لیست کامل <Icon name="chevron" size={12} className="rotate-180" />
        </button>
      </StencilCard>

      <div>
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm text-[#f3ede2] font-medium">نوبت‌های پیش رو</span>
          <button onClick={() => onNav("clients")} className="text-xs text-[#c9a06a] hover:text-[#e0b788]">همه</button>
        </div>
        {upcomingClients.length === 0 ? <EmptyState text="نوبتی ثبت نشده." /> : (
          <div className="space-y-2">
            {upcomingClients.map((c) => (
              <div key={c.id} className="flex items-center justify-between bg-[#1e1b18] rounded-sm px-3 py-2 border border-[#26221e]">
                <div>
                  <div className="text-sm text-[#f3ede2]">{c.name}</div>
                  <div className="text-[11px] text-[#9c9388]">{c.service}</div>
                </div>
                <div className="font-mono text-xs text-[#c9a06a]">{c.date}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Practice Log
--------------------------------------------------------- */
function PracticeLog({ sessions, setSessions }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ date: new Date().toISOString().slice(0, 10), surface: "پوست مصنوعی", technique: "", duration: "", rating: 3, notes: "" });
  const surfaces = ["پوست مصنوعی", "میوه (پرتقال/موز)", "کاغذ", "پوست واقعی (زیر نظر مربی)"];

  function addSession() {
    if (!form.technique.trim()) return;
    setSessions([{ id: uid(), ...form }, ...sessions]);
    setForm({ ...form, technique: "", duration: "", notes: "" });
    setShowForm(false);
  }
  function removeSession(id) { setSessions(sessions.filter((s) => s.id !== id)); }

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="لاگ روزانه" title="جلسات تمرین" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن جلسه"><Icon name="plus" size={16} /> جلسه جدید</IconBtn>
      } />

      {showForm && (
        <StencilCard className="space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <label className="text-xs text-[#9c9388]">تاریخ
              <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="mt-1 w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
            </label>
            <label className="text-xs text-[#9c9388]">سطح تمرین
              <select value={form.surface} onChange={(e) => setForm({ ...form, surface: e.target.value })} className="mt-1 w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]">
                {surfaces.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </label>
          </div>
          <label className="text-xs text-[#9c9388] block">تکنیک تمرین‌شده
            <input type="text" value={form.technique} onChange={(e) => setForm({ ...form, technique: e.target.value })} placeholder="مثلاً: خطوط منحنی، شیدینگ واش" className="mt-1 w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          </label>
          <div className="grid grid-cols-2 gap-3">
            <label className="text-xs text-[#9c9388]">مدت (دقیقه)
              <input type="number" min="0" value={form.duration} onChange={(e) => setForm({ ...form, duration: e.target.value })} className="mt-1 w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
            </label>
            <label className="text-xs text-[#9c9388]">رضایت از نتیجه
              <div className="mt-1.5 flex gap-1">
                {[1, 2, 3, 4, 5].map((n) => (
                  <button key={n} type="button" onClick={() => setForm({ ...form, rating: n })} aria-label={n + " ستاره"}>
                    <Icon name="star" size={18} fill={n <= form.rating ? "#c9a06a" : "none"} color={n <= form.rating ? "#c9a06a" : "#4a443a"} />
                  </button>
                ))}
              </div>
            </label>
          </div>
          <label className="text-xs text-[#9c9388] block">یادداشت
            <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} rows={2} placeholder="چی خوب پیش رفت، چی نیاز به تمرین بیشتر داره؟" className="mt-1 w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a] resize-none" />
          </label>
          <div className="flex gap-2 pt-1">
            <IconBtn onClick={addSession} label="ذخیره">ذخیره جلسه</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm text-[#9c9388] hover:text-[#f3ede2]">انصراف</button>
          </div>
        </StencilCard>
      )}

      {sessions.length === 0 ? <EmptyState text="هنوز جلسه‌ای ثبت نشده. اولین تمرینت رو ثبت کن." /> : (
        <div className="space-y-3">
          {sessions.map((s) => (
            <StencilCard key={s.id} className="relative">
              <button onClick={() => removeSession(s.id)} className="absolute left-3 top-3 text-[#6b6459] hover:text-[#b8272f]" aria-label="حذف جلسه"><Icon name="trash" size={14} /></button>
              <div className="flex items-center gap-2 mb-1">
                <span className="font-mono text-xs text-[#c9a06a]">{s.date}</span>
                <span className="text-[10px] text-[#9c9388] bg-[#26221e] px-2 py-0.5 rounded-full">{s.surface}</span>
              </div>
              <div className="text-[#f3ede2] font-medium">{s.technique}</div>
              {s.notes && <div className="text-sm text-[#9c9388] mt-1">{s.notes}</div>}
              <div className="flex items-center justify-between mt-2">
                <div className="flex gap-0.5">
                  {[1, 2, 3, 4, 5].map((n) => <Icon key={n} name="star" size={14} fill={n <= s.rating ? "#c9a06a" : "none"} color={n <= s.rating ? "#c9a06a" : "#4a443a"} />)}
                </div>
                {s.duration && <span className="font-mono text-[11px] text-[#9c9388]">{s.duration} دقیقه</span>}
              </div>
            </StencilCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Checklist
--------------------------------------------------------- */
function Checklist({ checklist, setChecklist }) {
  function toggle(id) { setChecklist({ ...checklist, [id]: !checklist[id] }); }
  return (
    <div className="space-y-6">
      <SectionTitle eyebrow="نقشه‌ی راه" title="چک‌لیست آموزش" />
      {CHECKLIST_STAGES.map((stage, idx) => {
        const done = stage.items.filter((it) => checklist[it.id]).length;
        return (
          <div key={stage.id}>
            <div className="flex items-center gap-2 mb-2">
              <span className="font-mono text-xs text-[#b8272f]">{String(idx + 1).padStart(2, "0")}</span>
              <h3 className="text-[#f3ede2] text-sm font-medium">{stage.title}</h3>
              <span className="font-mono text-[10px] text-[#9c9388] mr-auto">{done}/{stage.items.length}</span>
            </div>
            <div className="space-y-1.5">
              {stage.items.map((it) => (
                <button key={it.id} onClick={() => toggle(it.id)} className="w-full flex items-center gap-3 bg-[#1e1b18] border border-[#26221e] rounded-sm px-3 py-2.5 text-right hover:border-[#3a352e] transition-colors">
                  <span className={"flex-shrink-0 w-4 h-4 rounded-sm border flex items-center justify-center " + (checklist[it.id] ? "bg-[#b8272f] border-[#b8272f]" : "border-[#4a443a]")}>
                    {checklist[it.id] && <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5l3 3 5-6" stroke="#f3ede2" strokeWidth="1.5" fill="none"/></svg>}
                  </span>
                  <span className={"text-sm " + (checklist[it.id] ? "text-[#6b6459] line-through" : "text-[#f3ede2]")}>{it.label}</span>
                </button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------
   Reference Library
--------------------------------------------------------- */
function References({ refs, setRefs }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", url: "", tags: "", notes: "" });

  function addRef() {
    if (!form.title.trim()) return;
    setRefs([{ id: uid(), ...form }, ...refs]);
    setForm({ title: "", url: "", tags: "", notes: "" });
    setShowForm(false);
  }
  function removeRef(id) { setRefs(refs.filter((r) => r.id !== id)); }

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="کتابخانه" title="طرح‌ها و رفرنس" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن رفرنس"><Icon name="plus" size={16} /> رفرنس جدید</IconBtn>
      } />

      {showForm && (
        <StencilCard className="space-y-3">
          <input type="text" placeholder="عنوان (مثلاً: سبک اولد اسکول - گل رز)" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          <input type="text" placeholder="لینک تصویر یا رفرنس (اختیاری)" value={form.url} onChange={(e) => setForm({ ...form, url: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          <input type="text" placeholder="برچسب‌ها با کاما (سبک، سوژه، رنگ...)" value={form.tags} onChange={(e) => setForm({ ...form, tags: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          <textarea placeholder="یادداشت" rows={2} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a] resize-none" />
          <div className="flex gap-2">
            <IconBtn onClick={addRef} label="ذخیره">ذخیره</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm text-[#9c9388] hover:text-[#f3ede2]">انصراف</button>
          </div>
        </StencilCard>
      )}

      {refs.length === 0 ? <EmptyState text="هنوز رفرنسی اضافه نکردی." /> : (
        <div className="grid grid-cols-2 gap-3">
          {refs.map((r) => (
            <StencilCard key={r.id} className="relative">
              <button onClick={() => removeRef(r.id)} className="absolute left-2 top-2 text-[#6b6459] hover:text-[#b8272f]" aria-label="حذف"><Icon name="x" size={14} /></button>
              <div className="text-sm text-[#f3ede2] font-medium pl-4">{r.title}</div>
              {r.url && (
                <a href={r.url} target="_blank" rel="noreferrer" className="flex items-center gap-1 text-[11px] text-[#c9a06a] mt-1 truncate hover:text-[#e0b788]">
                  <Icon name="link" size={12} className="flex-shrink-0" /><span className="truncate">{r.url}</span>
                </a>
              )}
              {r.tags && (
                <div className="flex flex-wrap gap-1 mt-2">
                  {r.tags.split(",").map((t, i) => t.trim() && <span key={i} className="text-[10px] text-[#9c9388] bg-[#26221e] px-1.5 py-0.5 rounded-full">{t.trim()}</span>)}
                </div>
              )}
              {r.notes && <div className="text-xs text-[#9c9388] mt-2">{r.notes}</div>}
            </StencilCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Technical reference (static)
--------------------------------------------------------- */
function Technical() {
  return (
    <div className="space-y-6">
      <SectionTitle eyebrow="مرجع" title="اطلاعات فنی" />
      <StencilCard className="border-solid !bg-[#241a1a]">
        <p className="text-xs text-[#c9a06a] leading-relaxed">
          این بخش فقط یک مرور کلی برای یادگیریه. تنظیمات واقعیِ ولتاژ، سرعت و عمق به دستگاه، برند سوزن و توصیه‌ی مربیت بستگی داره — همیشه دستورالعمل مربی و سازنده‌ی دستگاه رو ملاک قرار بده.
        </p>
      </StencilCard>
      <div>
        <h3 className="text-[#f3ede2] text-sm font-medium mb-2">گروه‌بندی سوزن‌ها</h3>
        <div className="space-y-2">
          {NEEDLE_INFO.map((n) => (
            <div key={n.code} className="flex items-start gap-3 bg-[#1e1b18] border border-[#26221e] rounded-sm px-3 py-2.5">
              <span className="font-mono text-xs text-[#b8272f] bg-[#26221e] px-2 py-1 rounded-sm flex-shrink-0">{n.code}</span>
              <div>
                <div className="text-sm text-[#f3ede2]">{n.name}</div>
                <div className="text-xs text-[#9c9388]">{n.use}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div>
        <h3 className="text-[#f3ede2] text-sm font-medium mb-2">چک‌لیست بهداشتی هر جلسه</h3>
        <ul className="space-y-1.5 text-sm text-[#9c9388]">
          {["دستکش یک‌بار مصرف برای هر مشتری", "سوزن و کارتریج استریل و یک‌بار مصرف", "پوشش‌گذاری سطوح (بارریر) قبل از شروع", "ضدعفونی پوست قبل از استنسیل", "دفع صحیح زباله‌های نوک‌تیز (شارپس)"].map((t, i) => (
            <li key={i} className="flex items-start gap-2"><span className="w-1 h-1 rounded-full bg-[#c9a06a] mt-2 flex-shrink-0" />{t}</li>
          ))}
        </ul>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Portfolio
--------------------------------------------------------- */
function Portfolio({ portfolio, setPortfolio }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", date: new Date().toISOString().slice(0, 10), style: "", imageUrl: "", notes: "", rating: 3 });

  function addItem() {
    if (!form.title.trim()) return;
    setPortfolio([{ id: uid(), ...form }, ...portfolio]);
    setForm({ ...form, title: "", style: "", imageUrl: "", notes: "" });
    setShowForm(false);
  }
  function removeItem(id) { setPortfolio(portfolio.filter((p) => p.id !== id)); }

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="گالری" title="نمونه‌کارها" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن کار"><Icon name="plus" size={16} /> کار جدید</IconBtn>
      } />

      {showForm && (
        <StencilCard className="space-y-3">
          <input type="text" placeholder="عنوان کار" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          <div className="grid grid-cols-2 gap-3">
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
            <input type="text" placeholder="سبک (سنتی، خط‌محور...)" value={form.style} onChange={(e) => setForm({ ...form, style: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          </div>
          <input type="text" placeholder="لینک عکس (اختیاری)" value={form.imageUrl} onChange={(e) => setForm({ ...form, imageUrl: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          <textarea placeholder="یادداشت" rows={2} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a] resize-none" />
          <div className="flex gap-2">
            <IconBtn onClick={addItem} label="ذخیره">ذخیره</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm text-[#9c9388] hover:text-[#f3ede2]">انصراف</button>
          </div>
        </StencilCard>
      )}

      {portfolio.length === 0 ? <EmptyState text="هنوز کاری ثبت نشده." /> : (
        <div className="grid grid-cols-2 gap-3">
          {portfolio.map((p) => (
            <StencilCard key={p.id} className="relative overflow-hidden">
              <button onClick={() => removeItem(p.id)} className="absolute left-2 top-2 z-10 text-[#f3ede2] bg-[#141210]/70 rounded-full p-1 hover:text-[#b8272f]" aria-label="حذف"><Icon name="x" size={12} /></button>
              {p.imageUrl && <img src={p.imageUrl} alt={p.title} className="w-full h-24 object-cover rounded-sm mb-2 -mt-1" onError={(e) => (e.target.style.display = "none")} />}
              <div className="text-sm text-[#f3ede2] font-medium">{p.title}</div>
              <div className="text-[11px] text-[#9c9388]">{p.style} {p.style && "·"} {p.date}</div>
              {p.notes && <div className="text-xs text-[#9c9388] mt-1">{p.notes}</div>}
            </StencilCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Clients / bookings
--------------------------------------------------------- */
function Clients({ clients, setClients }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: "", phone: "", date: "", service: "", status: "در انتظار", notes: "" });

  function addClient() {
    if (!form.name.trim()) return;
    setClients([{ id: uid(), ...form }, ...clients]);
    setForm({ name: "", phone: "", date: "", service: "", status: "در انتظار", notes: "" });
    setShowForm(false);
  }
  function removeClient(id) { setClients(clients.filter((c) => c.id !== id)); }

  const statusColor = { "در انتظار": "#c9a06a", "قطعی": "#7fae7c", "انجام شد": "#6b6459" };

  return (
    <div className="space-y-5">
      <SectionTitle eyebrow="مدیریت" title="مشتری‌ها و نوبت‌ها" action={
        <IconBtn onClick={() => setShowForm((v) => !v)} label="افزودن مشتری"><Icon name="plus" size={16} /> مشتری جدید</IconBtn>
      } />

      {showForm && (
        <StencilCard className="space-y-3">
          <input type="text" placeholder="نام مشتری" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          <div className="grid grid-cols-2 gap-3">
            <input type="tel" placeholder="شماره تماس" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          </div>
          <input type="text" placeholder="نوع کار (مثلاً: خط‌محور کوچک روی مچ)" value={form.service} onChange={(e) => setForm({ ...form, service: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]" />
          <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a]">
            <option>در انتظار</option><option>قطعی</option><option>انجام شد</option>
          </select>
          <textarea placeholder="یادداشت" rows={2} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} className="w-full bg-[#141210] border border-[#3a352e] rounded-sm px-2 py-1.5 text-sm text-[#f3ede2] outline-none focus:border-[#c9a06a] resize-none" />
          <div className="flex gap-2">
            <IconBtn onClick={addClient} label="ذخیره">ذخیره</IconBtn>
            <button onClick={() => setShowForm(false)} className="px-3 py-2 text-sm text-[#9c9388] hover:text-[#f3ede2]">انصراف</button>
          </div>
        </StencilCard>
      )}

      {clients.length === 0 ? <EmptyState text="مشتری‌ای ثبت نشده." /> : (
        <div className="space-y-2">
          {clients.map((c) => (
            <StencilCard key={c.id} className="relative">
              <button onClick={() => removeClient(c.id)} className="absolute left-3 top-3 text-[#6b6459] hover:text-[#b8272f]" aria-label="حذف"><Icon name="trash" size={14} /></button>
              <div className="flex items-center gap-2">
                <span className="text-[#f3ede2] font-medium">{c.name}</span>
                <span className="text-[10px] px-2 py-0.5 rounded-full" style={{ color: statusColor[c.status] || "#9c9388", backgroundColor: "#26221e" }}>{c.status}</span>
              </div>
              <div className="text-sm text-[#9c9388] mt-1">{c.service}</div>
              <div className="flex items-center gap-4 mt-2 text-[11px] text-[#9c9388]">
                {c.phone && <span className="flex items-center gap-1"><Icon name="phone" size={12} /> {c.phone}</span>}
                {c.date && <span className="flex items-center gap-1 font-mono"><Icon name="calendar" size={12} /> {c.date}</span>}
              </div>
              {c.notes && <div className="text-xs text-[#9c9388] mt-1.5">{c.notes}</div>}
            </StencilCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   App shell
--------------------------------------------------------- */
const TABS = [
  { id: "dashboard", label: "خانه", icon: "grid" },
  { id: "practice", label: "تمرین", icon: "pencil" },
  { id: "checklist", label: "آموزش", icon: "list" },
  { id: "refs", label: "طرح‌ها", icon: "book" },
  { id: "portfolio", label: "نمونه‌کار", icon: "images" },
  { id: "clients", label: "مشتری", icon: "users" },
  { id: "technical", label: "فنی", icon: "info" },
];

function App() {
  const [tab, setTab] = useState("dashboard");
  const [sessions, setSessions] = useCollection(STORAGE_KEYS.sessions);
  const [refs, setRefs] = useCollection(STORAGE_KEYS.refs);
  const [portfolio, setPortfolio] = useCollection(STORAGE_KEYS.portfolio);
  const [clients, setClients] = useCollection(STORAGE_KEYS.clients);
  const [checklist, setChecklistState] = useState(() => loadLS(STORAGE_KEYS.checklist, {}));

  const setChecklist = useCallback((next) => {
    setChecklistState(next);
    saveLS(STORAGE_KEYS.checklist, next);
  }, []);

  return (
    <div dir="rtl" className="min-h-screen bg-[#141210] text-[#f3ede2] flex flex-col" style={{ fontFamily: "'Vazirmatn', 'Work Sans', sans-serif" }}>
      <main className="flex-1 max-w-md w-full mx-auto px-4 pt-6 pb-24">
        {tab === "dashboard" && <Dashboard sessions={sessions} checklist={checklist} clients={clients} onNav={setTab} />}
        {tab === "practice" && <PracticeLog sessions={sessions} setSessions={setSessions} />}
        {tab === "checklist" && <Checklist checklist={checklist} setChecklist={setChecklist} />}
        {tab === "refs" && <References refs={refs} setRefs={setRefs} />}
        {tab === "portfolio" && <Portfolio portfolio={portfolio} setPortfolio={setPortfolio} />}
        {tab === "clients" && <Clients clients={clients} setClients={setClients} />}
        {tab === "technical" && <Technical />}
      </main>
      <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto w-full bg-[#1a1715] border-t border-[#26221e] flex justify-around py-2 px-1">
        {TABS.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} className="flex flex-col items-center gap-1 px-1.5 py-1.5 flex-1">
            <Icon name={t.icon} size={18} color={tab === t.id ? "#c9a06a" : "#6b6459"} />
            <span className="text-[9px]" style={{ color: tab === t.id ? "#c9a06a" : "#6b6459" }}>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
